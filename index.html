<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avvisa Clienti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Avvisa Clienti</title>
<style>
:root{--g:#1f5fbf;--g2:#e7effb;--t:#17212b;--m:#6b7885;--l:#e3e8ec;--bg:#f3f6f8;--r:#c0392b;--o:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header small{display:block;font-weight:400;font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;font-size:18px;padding:8px 11px}
main{padding:12px 12px 20px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--m);display:grid;gap:1px;justify-items:center}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
nav i{position:absolute;margin:-2px 0 0 18px;background:var(--o);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--l)}
.row:first-of-type{border-top:0}
.row .x{flex:1;min-width:0}
.row .x b,.row .x span{display:block;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--m);font-size:13px}
.btn{border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:650;padding:12px 16px}
.btn.s{padding:8px 12px;font-size:14px}
.btn.o{background:var(--g2);color:var(--g)}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:650;background:var(--g2);color:var(--g)}
.pill.a{background:#fff1e6;color:var(--o)}.pill.r{background:#fdecea;color:var(--r)}.pill.m{background:#eef1f4;color:var(--m)}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfd8de;border-radius:11px;background:#fff;color:var(--t)}
textarea{min-height:120px;resize:vertical}
label.c{display:flex;gap:10px;align-items:center}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -2px 8px}
.chips button{flex:none;border:1px solid #cfd8de;background:#fff;border-radius:22px;padding:9px 14px;font-size:14px;color:var(--t)}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:650}
.seg{display:flex;background:#e9eef1;border-radius:11px;padding:3px;margin:6px 0}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;color:var(--m)}
.seg button.on{background:#fff;color:var(--t);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:19px}
.prev{white-space:pre-wrap;background:#f3f6f8;border-radius:11px;padding:11px 12px;font-size:14px;margin:8px 0}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{width:100%;max-width:380px;padding:22px}
.lock h1{margin:0 0 4px;font-size:24px;color:var(--g)}
.err{color:var(--r);font-size:14px;min-height:20px;margin:6px 0}
.empty{color:var(--m);padding:14px 4px;text-align:center}
.warn{background:#fff7e6;border:1px solid #f5d28b;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.big{font-size:19px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.fl{margin:10px 0 4px}
.tagc{border:1px solid #cfd8de;background:#fff;border-radius:22px;padding:7px 12px;font-size:14px;color:var(--t);margin:0 6px 6px 0}.tagc.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:650}
.fcard{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.dot{aspect-ratio:1;border-radius:50%;border:2px solid #1d2b36;display:flex;align-items:center;justify-content:center;font-size:16px;color:#9aa7b0;background:#fff}
.dot.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:800;font-size:20px}
.dot.last{border-width:3px}.dot.last:not(.on){font-size:22px}
</style>

</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Memoria piena: non riesco a salvare');return false}}};
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayIso=()=>isoOf(new Date());
const fmtD=i=>{const p=String(i||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''};
const eur=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const tc=v=>String(v||'').trim().toLowerCase().replace(/(^|[\s'-])(\S)/g,(m,a,b)=>a+b.toUpperCase());
const first=n=>tc(String(n||'').trim().split(/\s+/)[0]||'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normTel(v){let raw=String(v||'').trim();if(!raw)return'';let plus=raw.startsWith('+');let d=raw.replace(/\D/g,'');if(d.startsWith('00')){d=d.slice(2);plus=true}if(!plus&&!(d.startsWith('39')&&d.length>=11))d='39'+d.replace(/^0+(?=3)/,'');if(d.startsWith('39')&&!/^393\d{8,9}$/.test(d))return'';return d.length>=11&&d.length<=15?'+'+d:''}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function addMonths(iso,m){const p=String(iso).split('-').map(Number);if(p.length!==3||!p[0])return'';return isoOf(new Date(p[0],p[1]-1+Number(m||0),p[2]))}
function addDays(iso,n){const p=String(iso).split('-').map(Number);if(p.length!==3||!p[0])return'';return isoOf(new Date(p[0],p[1]-1,p[2]+Number(n||0)))}
const daysTo=iso=>{const p=String(iso).split('-').map(Number);if(p.length!==3)return 9999;const t=new Date();return Math.round((new Date(p[0],p[1]-1,p[2])-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)};

/* ---------- tipi di negozio (modelli di partenza) ---------- */
const TPL_LAV='Buongiorno {nome}, {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!';
const TPL_SCA='Buongiorno {nome}, ricordiamo la scadenza di {titolo} il {data}. Passi da {negozio}{indirizzo}, siamo a disposizione!';
const PRESETS={
 telefonia:{nome:'Telefonia / Elettronica',tags:[],tipi:[
  {id:'rip',nome:'Riparazione',icona:'🛠️',modo:'lavoro',lt:'Dispositivo (es. iPhone 12)',ld:'Guasto / lavoro',tpl:'Buongiorno {nome}, il suo {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!'},
  {id:'contr',nome:'Contratto',icona:'📄',modo:'scadenza',lt:'Servizio (luce, gas, fibra…)',lf:'Gestore / fornitore',dopo:365,giorni:30,tpl:'Buongiorno {nome}, il suo contratto {titolo} {fornitore} scade il {data}. Passi da {negozio}{indirizzo} per vedere le nuove offerte!'}]},
 auto:{nome:'Officina / Auto',tags:[],tipi:[
  {id:'lavoro',nome:'Lavoro in officina',icona:'🔧',modo:'lavoro',lt:'Veicolo (modello / targa)',ld:'Intervento',tpl:'Buongiorno {nome}, il suo veicolo {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!'},
  {id:'tagl',nome:'Tagliando / Revisione',icona:'🚗',modo:'scadenza',lt:'Veicolo (modello / targa)',lf:'Cosa (tagliando, revisione…)',dopo:365,giorni:30,tpl:'Buongiorno {nome}, per {titolo} {fornitore} la scadenza è il {data}. Ci chiami o passi da {negozio}{indirizzo} per prenotare.'}]},
 estetica:{nome:'Parrucchiere / Estetica',tags:[],tipi:[
  {id:'trat',nome:'Promemoria trattamento',icona:'💇',modo:'scadenza',lt:'Trattamento (colore, taglio…)',lf:'',dopo:60,giorni:7,tpl:'Buongiorno {nome}, è ora di pensare al prossimo appuntamento per {titolo}. La aspettiamo da {negozio}{indirizzo}!'}]},
 altro:{nome:'Altro tipo di negozio',tags:[],tipi:[
  {id:'lavoro',nome:'Lavoro da riconsegnare',icona:'🧰',modo:'lavoro',lt:'Oggetto',ld:'Descrizione del lavoro',tpl:TPL_LAV},
  {id:'prom',nome:'Promemoria con scadenza',icona:'⏰',modo:'scadenza',lt:'Cosa scade',lf:'',dopo:365,giorni:30,tpl:TPL_SCA}]}
};
const cloneTipo=(t,id)=>Object.assign({},t,{id:id||uid()});

/* ---------- dati (restano in questo telefono) ---------- */
function migrate(d){
 if(!d||d.v>=2)return d;
 const t=PRESETS.telefonia.tipi.map(x=>Object.assign({},x));
 const tp=LS.get('ac_tpl',{});if(tp.rip)t[0].tpl=String(tp.rip).split('{dispositivo}').join('{titolo}');if(tp.scad)t[1].tpl=String(tp.scad).split('{contratto}').join('{titolo} {fornitore}');
 const schede=[];
 for(const x of d.rip||[])schede.push({id:x.id,tid:'rip',cid:x.cid,titolo:x.disp||'',dettaglio:x.guasto||'',prezzo:x.prezzo,stato:x.stato||'lavorazione',data:x.data,pronto:x.pronto,ritiro:x.ritiro,note:x.note||''});
 for(const x of d.contr||[])schede.push({id:x.id,tid:'contr',cid:x.cid,titolo:x.tipo||'',fornitore:x.gestore||'',inizio:x.inizio,mesi:x.mesi,scad:x.scad||addMonths(x.inizio,x.mesi),note:x.note||'',chiuso:x.chiuso});
 const g=Number(d.shop&&d.shop.giorni)||30;t[1].giorni=g;
 return{v:2,shop:Object.assign({nome:'',indirizzo:''},d.shop),tags:[],tipi:t,clienti:(d.clienti||[]).map(c=>Object.assign({tags:[]},c)),schede};
}
let S=migrate(LS.get('ac_data',null))||{v:2,shop:{nome:'',indirizzo:''},tags:[],tipi:[],clienti:[],schede:[]};
if(S.v>=2&&!LS.get('ac_data',{}).v)LS.set('ac_data',S);
S.tags=[];S.clienti.forEach(c=>{delete c.tags});S.prod=S.prod||[];
const save=()=>LS.set('ac_data',S);
setTimeout(()=>{if(norm()){save();try{draw()}catch(e){}}},0);
const hasCons=c=>c.cons===true;
const cli=id=>S.clienti.find(c=>c.id===id)||{id:'',nome:'(cliente eliminato)',tel:'',tags:[]};
const tipo=id=>S.tipi.find(t=>t.id===id);
const sent=()=>LS.get('ac_sent',{});
function markSent(key){const s=sent();s[key]=Date.now();LS.set('ac_sent',s)}
const isSent=key=>sent()[key];
const sentTxt=key=>{const t=isSent(key);return t?'✓ '+fmtD(isoOf(new Date(t))):''};
const ST={lavorazione:'In lavorazione',pronto:'Pronto',ritirato:'Ritirato'};
const STO={lavorazione:'Ordinato',pronto:'Arrivato',ritirato:'Ritirato'};
const stOf=t=>t&&t.kind==='ordine'?STO:ST;
const KINDS={
 lavoro:{modo:'lavoro',s:'Lavoro da riconsegnare',nome:'Lavoro da riconsegnare (in lavorazione → pronto → ritirato)',d:{icona:'🧰',lt:'Oggetto',ld:'Descrizione',tpl:TPL_LAV}},
 ordine:{modo:'lavoro',s:'Ordine per il cliente',nome:'Ordine per il cliente (ordinato → arrivato → ritirato)',d:{icona:'📦',lt:'Prodotto ordinato',ld:'Note sull’ordine',tpl:'Buongiorno {nome}, {titolo} che aveva ordinato è arrivato: può ritirarlo presso {negozio}{indirizzo}.{importo} Grazie!'}},
 acquisto:{modo:'scadenza',s:'Ricontatto dopo un acquisto',nome:'Ricontatto dopo un acquisto (conta solo l’ultimo acquisto)',d:{icona:'🛒',lt:'Cosa ha acquistato',lf:'',dopo:30,giorni:0,uno:'1',tpl:'Buongiorno {nome}, è passato un po’ di tempo dal suo ultimo acquisto. Passi a trovarci da {negozio}{indirizzo}: abbiamo delle novità per lei!'}},
 scadenza:{modo:'scadenza',s:'Scadenza o contratto',nome:'Scadenza o contratto (anche più insieme per lo stesso cliente)',d:{icona:'📄',lt:'Cosa scade',lf:'Gestore / fornitore',dopo:365,giorni:30,uno:'0',tpl:TPL_SCA}},
 appunt:{modo:'scadenza',s:'Appuntamento',nome:'Appuntamento (da ricordare al cliente il giorno prima)',x:{ldata:'Data dell’appuntamento',serv:true},d:{icona:'📅',lt:'Motivo dell’appuntamento',lf:'',dopo:0,giorni:1,uno:'0',tpl:'Buongiorno {nome}, le ricordiamo l’appuntamento del {data} per {titolo} presso {negozio}{indirizzo}. A presto!'}},
 prev:{modo:'scadenza',s:'Preventivo da risentire',nome:'Preventivo da risentire (dopo qualche giorno)',x:{ldata:'Data del preventivo'},d:{icona:'🧾',lt:'Preventivo per',lf:'',dopo:7,giorni:0,uno:'0',tpl:'Buongiorno {nome}, ha avuto modo di pensare al preventivo per {titolo}? Siamo a disposizione da {negozio}{indirizzo}.'}},
 garanzia:{modo:'scadenza',s:'Garanzia in scadenza',nome:'Garanzia in scadenza (avvisa prima che scada)',d:{icona:'🛡️',lt:'Prodotto in garanzia',lf:'',dopo:730,giorni:30,uno:'0',tpl:'Buongiorno {nome}, la garanzia di {titolo} scade il {data}. Passi da {negozio}{indirizzo} se desidera un controllo prima della scadenza.'}}
};
const kindOf=t=>t.kind&&KINDS[t.kind]?t.kind:(t.modo==='lavoro'?'lavoro':(unoT(t)?'acquisto':'scadenza'));
const unoT=t=>!!t&&t.modo==='scadenza'&&(t.uno!=null?!!t.uno:!t.lf);
function norm(){let ch=false;for(const t of S.tipi){if(t.modo!=='scadenza')continue;const l=S.schede.filter(x=>x.tid===t.id);
 if(!unoT(t)){l.forEach(x=>{if(x.chiusoDa){x.chiuso=false;delete x.chiusoDa;ch=true}});continue}
 const g={};l.forEach((x,i)=>{if(!x.chiuso&&x.cid)(g[x.cid]=g[x.cid]||[]).push({x,i})});
 for(const k in g){const a=g[k];if(a.length<2)continue;a.sort((p,q)=>String(q.x.inizio||'').localeCompare(String(p.x.inizio||''))||q.i-p.i);a.slice(1).forEach(o=>{o.x.chiuso=true;o.x.chiusoDa=a[0].x.id;ch=true})}}
 return ch}
const tAcq=()=>S.tipi.find(unoT)||S.tipi.find(t=>t.modo==='scadenza');
const tdopo=t=>t&&t.dopo!=null?Number(t.dopo):((t&&Number(t.mesi))||12)*30;
const scadOf=x=>{if(x.scad)return x.scad;if(x.mesi)return addMonths(x.inizio,x.mesi);return addDays(x.inizio,tdopo(tipo(x.tid)))};

/* ---------- modelli messaggio ---------- */
const DEF={fid:'Buongiorno {nome}, la tua fidelity card di {negozio} è completa! 🎁 Passa a ritirare: {premio}.',auguri:'Buon compleanno {nome}! 🎂 Tanti auguri da {negozio}.',libero:'Buongiorno {nome}, '};
const tpl=k=>{if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?t.tpl:''}return(LS.get('ac_tpl',{})[k])||DEF[k]};
const defTpl=k=>{if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?(t.modo==='lavoro'?TPL_LAV:TPL_SCA):''}return DEF[k]};
const shopName=()=>S.shop.nome||'noi';
function fill(t,r,grp){let o=String(t);const v=Object.assign({nome:grp?'':first(r.nome),negozio:shopName(),indirizzo:S.shop.indirizzo?' ('+S.shop.indirizzo+')':''},r.vars||{});for(const k in v)o=o.split('{'+k+'}').join(v[k]);if(!v.nome)o=o.replace(/ \{nome\}/g,'').replace(/\{nome\}/g,'').replace(/Buongiorno ,/g,'Buongiorno,');return o.replace(/ {2,}/g,' ').replace(/ ,/g,',').replace(/ \./g,'.')}
function schedaVars(x,d){const t=tipo(x.tid)||{};return{titolo:x.titolo||'',dettaglio:x.dettaglio||'',fornitore:x.fornitore||'',data:fmtD(d||scadOf(x)),importo:Number(x.prezzo)>0?' Importo: '+eur(x.prezzo)+'.':'',dispositivo:x.titolo||'',contratto:((x.titolo||'')+' '+(x.fornitore||'')).trim()}}

/* ---------- fidelity card ---------- */
const fid=()=>S.fid||(S.fid={on:false,n:10,premio:'un premio in omaggio'});
const fnum=()=>Math.max(2,Number(fid().n)||10);
const fget=c=>c.fid||{t:0,p:0};
const fcd=c=>c.fid||(c.fid={t:0,p:0});
const fFull=c=>fget(c).t>=fnum();
function cardHtml(c){const d=fget(c),n=fnum();let h='<div class="fcard">';for(let i=1;i<=n;i++){const on=i<=d.t;h+=`<div class="dot ${on?'on':''} ${i===n?'last':''}">${i===n?'🎁':(on?'✓':i)}</div>`}return h+'</div>'}
function fidSheet(c){
 const f=fid(),d=fget(c),n=fnum(),full=d.t>=n;
 const o=sheet(`<h3>🎟️ ${esc(c.nome)}</h3><div class="sub">Fidelity card · ${d.t}/${n} timbri${d.p?' · premi già ritirati: '+d.p:''}</div>${cardHtml(c)}<div class="prev">🎁 Premio: ${esc(f.premio)}</div>${full?'<button class="btn w" id="fRit">🎁 Consegna il premio e riparti da zero</button>':'<button class="btn w" id="fAdd">＋ Aggiungi un timbro</button>'}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn o" style="flex:1" id="fSub">− Togli timbro</button><button class="btn o" style="flex:1" id="fX">Chiudi</button></div>`);
 const again=()=>{const y=scrollY;draw();scrollTo(0,y);fidSheet(c)};
 $('#fX').onclick=()=>o.remove();
 const a=$('#fAdd');if(a)a.onclick=()=>{const x=fcd(c);x.t++;x.ult=todayIso();save();toast(x.t>=n?'Card completa! 🎁':'Timbro aggiunto: '+x.t+'/'+n);again()};
 const r=$('#fRit');if(r)r.onclick=()=>{if(!confirm('Consegnare il premio a '+c.nome+' e azzerare i timbri?'))return;const x=fcd(c);x.t=0;x.p=(x.p||0)+1;save();toast('Premio consegnato, si riparte!');again()};
 $('#fSub').onclick=()=>{const x=fcd(c);if(x.t>0){x.t--;save()}again()}}

/* ---------- prodotti / magazzino ---------- */
const prods=()=>S.prod||(S.prod=[]);
const isLow=p=>(Number(p.qta)||0)<=0||(Number(p.min)>0&&(Number(p.qta)||0)<=Number(p.min));
const prodSel=(pk,qk,tk,label)=>{const l=prods().slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it'));if(!l.length)return'';return `<div class="sub fl">${esc(label)}</div><div style="display:flex;gap:8px"><select data-f="${pk}" data-pk="1" data-tk="${tk}"><option value="">— nessuno —</option>${l.map(p=>`<option value="${p.id}">${esc(p.nome)} (${Number(p.qta)||0} in magazzino)</option>`).join('')}</select><button type="button" class="btn s o" data-scan="${pk}" style="flex:none">📷</button></div><input data-f="${qk}" type="number" inputmode="numeric" value="1" min="1" placeholder="Quantità" style="margin-top:8px">`};
let scanStream=null;
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}document.getElementById('scov')?.remove()}
async function scanBarcode(cb){
 stopScan();
 const o=document.createElement('div');o.id='scov';o.style.cssText='position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column';
 o.innerHTML='<video id="scv" playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div style="background:#fff;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))"><div class="sub" id="scMsg">Inquadra il codice a barre del prodotto</div><div style="display:flex;gap:8px;margin-top:8px"><input id="scMan" placeholder="…oppure scrivi il codice" inputmode="numeric"><button class="btn s" id="scOk" style="flex:none">Usa</button></div><button class="btn o w" style="margin-top:10px" id="scX">Annulla</button></div>';
 document.body.appendChild(o);
 const done=code=>{stopScan();if(navigator.vibrate)navigator.vibrate(60);cb(String(code).trim())};
 o.querySelector('#scX').onclick=stopScan;
 o.querySelector('#scOk').onclick=()=>{const v=o.querySelector('#scMan').value.trim();if(v)done(v)};
 const msgEl=o.querySelector('#scMsg'),vid=o.querySelector('#scv');
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){vid.style.display='none';msgEl.textContent='Questo telefono non legge i codici con la fotocamera: scrivi il codice a mano (o usa un lettore Bluetooth).';return}
 try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}catch(e){vid.style.display='none';msgEl.textContent='Non riesco ad aprire la fotocamera: consenti l’accesso nelle impostazioni del browser, oppure scrivi il codice a mano.';return}
 vid.srcObject=scanStream;try{await vid.play()}catch(e){}
 let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']})}catch(e){det=new BarcodeDetector()}
 const tick=async()=>{if(!document.getElementById('scov'))return;try{const r=await det.detect(vid);if(r.length){done(r[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick()}

 r=>{if(r.codice&&prods().some(x=>x.codice===r.codice&&x!==p))return'Questo codice è già usato da un altro prodotto';r.qta=Math.max(0,Number(r.qta)||0);r.min=Number(r.min)||'';r.prezzo=r.prezzo===''?'':Number(r.prezzo);if(n)prods().push(Object.assign({id:uid()},r));else Object.assign(p,r)},

function bdays(maxOff){const t=new Date(),out=[];for(let off=0;off<=maxOff;off++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+off);for(const c of S.clienti.filter(hasCons)){const p=String(c.nasc||'').split('-').map(Number);if(p.length===3&&p[1]===d.getMonth()+1&&p[2]===d.getDate())out.push({c,off,key:'a|'+c.id+'|'+d.getFullYear()})}}return out}
function dueItems(t,all){
 if(t.modo==='lavoro')return S.schede.filter(x=>x.tid===t.id&&x.stato==='pronto').map(x=>({x,t,key:'r|'+x.id+'|'+(x.pronto||''),info:(x.titolo||'')+(x.pronto?(t.kind==='ordine'?' · arrivato il ':' · pronto il ')+fmtD(x.pronto):'')}));
 const g=Number(t.giorni)||0;
 return S.schede.filter(x=>x.tid===t.id&&!x.chiuso&&(all||t.serv||hasCons(cli(x.cid)))).map(x=>{const d=scadOf(x);return{x,t,d,gg:daysTo(d),key:'s|'+x.id+'|'+d}}).filter(o=>o.d&&o.gg<=g).sort((a,b)=>a.d.localeCompare(b.d)).map(o=>Object.assign(o,{info:(!tdopo(t)?'il ':o.gg<0?'da ricontattare dal ':'da ricontattare il ')+fmtD(o.d)+' · '+(o.x.titolo||'')+(o.x.fornitore?' '+o.x.fornitore:'')}))}
const recOf=o=>{const c=cli(o.x.cid);return{id:o.key,nome:c.nome,tel:c.tel,info:o.info,due:true,vars:schedaVars(o.x,o.d)}};
function recipients(k){
 if(k==='auguri')return bdays(7).map(b=>({id:b.key,nome:b.c.nome,tel:b.c.tel,info:b.off===0?'Oggi':b.off===1?'Domani':'tra '+b.off+' giorni',due:b.off===0,vars:{}}));
 if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?dueItems(t).map(recOf):[]}
 if(k==='fid')return S.clienti.filter(c=>c.tel&&fFull(c)&&hasCons(c)).map(c=>({id:'f|'+c.id+'|'+(fget(c).p||0),nome:c.nome,tel:c.tel,info:'Card completa 🎁',due:true,vars:{premio:fid().premio}}));
 if(k==='libero'){const q=msg.q.trim().toLowerCase(),dq=q.replace(/\D/g,'');let l=S.clienti.filter(c=>c.tel&&hasCons(c));if(msg.tag)l=l.filter(c=>(c.tags||[]).includes(msg.tag));if(q)l=l.filter(c=>c.nome.toLowerCase().includes(q)||(dq.length>=3&&c.tel.replace(/\D/g,'').includes(dq)));
  const out=l.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it')).slice(0,100).map(c=>({id:'l|'+c.id,nome:c.nome,tel:c.tel,info:c.tel+((c.tags||[]).length?' · '+c.tags.join(', '):''),due:false,vars:{}}));
  for(const id in msg.sel)if(msg.sel[id]&&msg.sel[id].extra&&!out.find(o=>o.id===id))out.unshift(msg.sel[id].extra);return out}
 return[]}

function decText(buf){const u=new Uint8Array(buf);if(u.length>3&&u[0]===0x50&&u[1]===0x4B)return null;

 const rows=[];let row=[],f='',q=false;const end=()=>{row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]};
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"'&&f==='')q=true;
  else if(c===d){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;end()}

const pickTel=a=>{a=(a||[]).map(x=>String(x).trim()).filter(Boolean);return a.find(x=>normTel(x))||a[0]||''};
function parseNasc(s){s=String(s||'').trim();let m;
 if(m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})/))s=m[1]+'-'+m[2]+'-'+m[3];
 else if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))s=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');else return'';

 t=t.replace(/\r\n?/g,'\n');if(/QUOTED-PRINTABLE/i.test(t))t=t.replace(/=\n/g,'');t=t.replace(/\n[ \t]/g,'');
 const out=[];let cur=null;
 for(const line of t.split('\n')){const L=line.trim();if(!L)continue;
  if(/^BEGIN:VCARD/i.test(L)){cur={fn:'',n:'',cell:[],oth:[],bday:''};continue}
  if(/^END:VCARD/i.test(L)){if(cur)out.push(cur);cur=null;continue}

  const [nm,...pa]=L.slice(0,i).replace(/^item\d+\./i,'').split(';'),N=nm.toUpperCase(),P=pa.join(';'),val=L.slice(i+1),v=/QUOTED-PRINTABLE/i.test(P)?qp(val):val;
  if(N==='FN')cur.fn=un(v).trim();

  else if(N==='BDAY')cur.bday=v}

function csvSource(name,rows){

 const cls=rows[0].map(cl),hasHead=cls.some(Boolean),nc=Math.max(...rows.slice(0,50).map(r=>r.length));

/* ---------- cifratura, blocco con codice, copia ---------- */
const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encText(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(pw,salt,250000);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt)));return JSON.stringify({app:'avvisa-clienti',enc:1,iter:250000,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function decObj(o,pw){const key=await aesKey(pw,unb64(o.salt),o.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,256)))}
async function setPin(pin){const salt=crypto.getRandomValues(new Uint8Array(16)),old=LS.get('ac_pin',null)||{},n={salt:b64(salt),hash:await pinHash(pin,salt)};if(old.rhash){n.rsalt=old.rsalt;n.rhash=old.rhash}LS.set('ac_pin',n)}
const recNorm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

 <details class="sg" data-g="pin"${(window._sOpen||[]).includes("pin")?" open":""}><summary>🔒 Blocco con codice</summary>
${(()=>{const has=!!LS.get('ac_pin',null);return `<div class="sub">Il codice è obbligatorio: l’app lo chiede quando la apri (e se resta in background più di 2 minuti). Se lo dimentichi ti serve il codice di recupero che hai salvato; qui puoi fartene dare uno nuovo (quello vecchio smette di valere). Nasconde i clienti a chi prende il tuo telefono in mano; per la sicurezza completa tieni anche il blocco schermo del telefono.</div>${has?`<input id="pCur" type="password" inputmode="numeric" placeholder="Codice attuale" style="margin-top:8px"><input id="pNew" type="password" inputmode="numeric" placeholder="Nuovo codice (solo per cambiarlo)" style="margin-top:8px"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn s o" id="pChg" style="flex:1">Cambia codice</button><button class="btn s o" id="pRec" style="flex:1">Nuovo codice di recupero</button></div>`:`<input id="pNew" type="password" inputmode="numeric" placeholder="Scegli un codice (4-8 cifre)" style="margin-top:8px"><input id="pNew2" type="password" inputmode="numeric" placeholder="Ripeti il codice" style="margin-top:8px"><button class="btn s o w" id="pOn" style="margin-top:8px">Attiva il blocco</button>`}<div class="err" id="pErr"></div>`})()}
 </details>
 <details class="sg" data-g="lic"${(window._sOpen||[]).includes("lic")?" open":""}><summary>🔑 Licenza e assistenza</summary>
<div class="sub" style="color:var(--t)">${licText()}</div><div class="sub" style="margin-top:4px">${licBuy()}</div><a class="btn w o" style="display:block;text-align:center;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="${assistWa()}">🛟 Richiedi l'assistenza (${LICM} € al mese)</a>${licId()}<input id="lcKey" placeholder="Incolla qui il codice di licenza" style="margin-top:8px"><div class="err" id="lcErr"></div><button class="btn s o w" id="lcGo">Attiva il codice</button>
 </details>
 <button class="btn o w" style="margin-top:10px" id="sX">Chiudi</button><div class="sub" style="text-align:center;margin-top:12px">Versione ${VER}<br>© 2026 Novatech di Porcino Danilo – Tutti i diritti riservati</div>`);
 const back=()=>{draw();settings()};
 $('#sX').onclick=()=>o.remove();
 o.querySelectorAll('[data-et]').forEach(r=>r.onclick=()=>editTipo(tipo(r.dataset.et),back));
 $('#sNewT').onclick=()=>editTipo(null,back);
 o.querySelectorAll('details.sg').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){o.querySelectorAll('details.sg[open]').forEach(x=>{if(x!==d)x.open=false});setTimeout(()=>d.scrollIntoView({block:'start',behavior:'smooth'}),30)}window._sOpen=[...o.querySelectorAll('details.sg[open]')].map(x=>x.dataset.g)}));
 o.querySelectorAll('.sSaveB').forEach(bt=>bt.onclick=()=>{const ff=fid();ff.on=$('#fOn').checked;ff.n=Math.min(30,Math.max(2,Number($('#fN').value)||10));ff.premio=$('#fP').value.trim()||'un premio in omaggio';S.shop.nome=$('#sN').value.trim();S.shop.indirizzo=$('#sI').value.trim();const s={};o.querySelectorAll('[data-tp2]').forEach(t=>{if(t.value.trim()&&t.value!==DEF[t.dataset.tp2])s[t.dataset.tp2]=t.value});LS.set('ac_tpl',s);save();msg.text=msg.tipo?tpl(msg.tipo):'';toast('Salvato');o.remove();draw()});
 $('#sExp').onclick=()=>{o.remove();backupFlow()};
 $('#sReset').onclick=()=>{if(!confirm('Cancello TUTTI i dati di questa app (clienti, schede, messaggi, codice di blocco)?\n\nNon si può annullare. Se non hai ancora salvato una copia, premi Annulla e usa prima «Salva una copia dei dati».'))return;
  const keep={};['ac_trial','ac_lic','ac_dev'].forEach(k=>{const v=localStorage.getItem(k);if(v!=null)keep[k]=v});
  try{Object.keys(localStorage).filter(k=>k.startsWith('ac_')&&!(k in keep)).forEach(k=>localStorage.removeItem(k))}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  location.reload()};
 $('#sImp').onclick=()=>$('#sFl').click();
 $('#sFl').onchange=async()=>{const f=$('#sFl').files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){toast('Questo file non è una copia valida');return}
  const fin=async jj=>{try{if(applyBackup(jj)){await licInit();o.remove();draw();toast('Dati ripristinati')}}catch(e){toast('Questo file non è una copia valida')}};
  if(j.enc)askPw('Copia protetta','Scrivi la password scelta quando hai salvato la copia.',async pw=>{try{fin(await decObj(j,pw));return''}catch(e){return'Password sbagliata'}});else fin(j)};
 $('#idCp').onclick=idCopy;
 $('#lcGo').onclick=async()=>{const r=await licActivate($('#lcKey').value);$('#lcErr').textContent=r;if(!r){toast('Licenza attivata, grazie!');o.remove();draw();settings()}};
 const pe=t=>{$('#pErr').textContent=t};
 const on=$('#pOn');if(on)on.onclick=async()=>{const a=$('#pNew').value,b=$('#pNew2').value;if(!/^\d{4,8}$/.test(a))return pe('Il codice deve avere da 4 a 8 cifre');if(a!==b)return pe('I due codici non coincidono');await setPin(a);toast('Blocco attivato');o.remove();settings()};
 const ch=$('#pChg');if(ch){ch.onclick=async()=>{if(!await checkPin($('#pCur').value))return pe('Codice attuale sbagliato');const a=$('#pNew').value;if(!/^\d{4,8}$/.test(a))return pe('Il nuovo codice deve avere da 4 a 8 cifre');await setPin(a);toast('Codice cambiato');o.remove();settings()};
  $('#pRec').onclick=async()=>{if(!await checkPin($('#pCur').value))return pe('Scrivi prima il codice attuale');const rc=await setRec();o.remove();showRec(rc)};
  }
}

/* ---------- copia automatica su Google Drive (cartella nascosta dell'app) ---------- */
const GD_CID='56116693077-lk0si01qtl4o8u8agv7mtjdbljv95sua.apps.googleusercontent.com',GD_SCOPE='https://www.googleapis.com/auth/drive.appdata',GD_FILE='avvisa-clienti-backup.json',GD_DAYS={d:1,w:7,m:30},GD_NOME={d:'ogni giorno',w:'ogni settimana',m:'ogni mese'};
const gdCfg=()=>Object.assign({on:false,freq:'d',pw:'',last:0,err:''},LS.get('ac_gd',{}));
const gdSet=p=>LS.set('ac_gd',Object.assign(gdCfg(),p));
let gdTok=null,gdTokExp=0,gdBusy=false;
function gdScript(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s)})}
function gdToken(interactive,choose){return new Promise(async(res,rej)=>{
 if(gdTok&&Date.now()<gdTokExp)return res(gdTok);
 try{await gdScript()}catch(e){return rej(new Error('Nessuna connessione a internet'))}
 let done=false;const fin=(f,v)=>{if(!done){done=true;clearTimeout(tm);f(v)}},tm=setTimeout(()=>fin(rej,new Error('Google non ha risposto')),interactive?120000:20000);
 try{const tc=google.accounts.oauth2.initTokenClient({client_id:GD_CID,scope:GD_SCOPE,callback:r=>{if(r&&r.access_token){gdTok=r.access_token;gdTokExp=Date.now()+((Number(r.expires_in)||3600)-120)*1000;fin(res,gdTok)}else fin(rej,new Error(r&&r.error==='access_denied'?'Non hai dato il permesso a Google Drive':'Accesso a Google non riuscito'))},error_callback:()=>fin(rej,new Error('Accesso a Google annullato'))});tc.requestAccessToken(choose?{prompt:'select_account'}:interactive?{}:{prompt:'none'})}catch(e){fin(rej,new Error('Accesso a Google non disponibile'))}})}
async function gdApi(url,opt,tok){const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},(opt&&opt.headers)||{})}));if(r.status===401){gdTok=null;throw new Error('Accesso scaduto: ricollega Google Drive')}if(!r.ok)throw new Error(r.status===403?'Google Drive non ha dato il permesso (controlla di aver spuntato la casella di Drive)':'Errore di Google Drive ('+r.status+')');return r}
async function gdAcct(tok){try{const j=await(await gdApi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)',{},tok)).json();if(j.user&&j.user.emailAddress)gdSet({acct:j.user.emailAddress})}catch(e){}}
async function gdFind(tok){const r=await gdApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='"+GD_FILE+"'"),{},tok);const j=await r.json();return(j.files||[])[0]||null}
async function gdUpload(txt,tok){const f=await gdFind(tok);
 if(f){await gdApi('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:txt},tok);return}
 const b='acb'+Math.random().toString(36).slice(2),body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:GD_FILE,parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+txt+'\r\n--'+b+'--';
 await gdApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body},tok)}
async function gdPayload(){let txt=JSON.stringify({app:'avvisa-clienti',at:new Date().toISOString(),trial:LS.get('ac_trial',null),data:S,tpl:LS.get('ac_tpl',{}),sent:sent(),gdf:gdCfg().freq});const c=gdCfg();if(c.pw)txt=await encText(txt,c.pw);return txt}
async function gdBackup(manual){
 if(gdBusy)return;gdBusy=true;
 try{const tok=await gdToken(!!manual);await gdAcct(tok);await gdUpload(await gdPayload(),tok);gdSet({last:Date.now(),err:''});LS.set('ac_bk',Date.now());if(manual)toast('Copia salvata su Google Drive ✓')}
 catch(e){const m=e&&e.message?e.message:'Errore';gdSet({err:manual?m:'reconnect'});if(manual)toast(m)}
 finally{gdBusy=false;if(document.getElementById('sov')&&document.getElementById('gdBox'))gdRefresh();else draw()}}
const gdDue=()=>{const c=gdCfg();return c.on&&Date.now()-c.last>=GD_DAYS[c.freq]*864e5-6*36e5};
function gdAuto(){if(!gdCfg().on||gdBusy||!gdDue()||!navigator.onLine||document.hidden)return;gdBackup(false)}
function gdRefresh(){document.getElementById('sov')?.remove();settings()}
function gdAsk(){
 const c=gdCfg(),o=sheet(`<h3>☁️ Copia automatica su Google Drive</h3><div class="sub">L'app salva da sola una copia dei tuoi dati sul <b>tuo</b> Google Drive, in una cartella nascosta che solo questa app può vedere. Se cambi o perdi il telefono, la ripristini in pochi secondi.</div><div class="sub fl">Quando salvare la copia?</div><select id="gdF"><option value="d">Ogni giorno</option><option value="w">Ogni settimana</option><option value="m">Ogni mese</option></select><div class="sub fl">Password per proteggere la copia (consigliata)</div><input id="gdP" type="password" placeholder="Password (vuoto = copia non protetta)"><div class="sub" style="margin-top:6px">Annotala: ti serve per ripristinare i dati su un altro telefono. Se la dimentichi la copia non si può riaprire.</div><div class="err" id="gdE"></div><button class="btn w" id="gdGo" style="margin-top:12px">Collega Google Drive</button><button class="btn o w" style="margin-top:10px" id="gdX">Annulla</button><div class="sub" style="margin-top:10px">La copia parte quando apri l'app e ne è passato il tempo scelto: se l'app resta chiusa non può salvare.</div>`);
 $('#gdF').value=c.freq;$('#gdX').onclick=()=>o.remove();
 $('#gdGo').onclick=()=>{const freq=$('#gdF').value,pw=$('#gdP').value;$('#gdE').textContent='';gdTok=null;gdToken(true,true).then(()=>{gdSet({on:true,freq,pw,last:0,err:'',acct:''});o.remove();return gdBackup(true)}).catch(e=>{$('#gdE').textContent=e.message||'Errore'})}}
async function gdRestore(after){
 let tok,f;try{gdTok=null;tok=await gdToken(true,true);f=await gdFind(tok)}catch(e){toast(e.message||'Errore');return}
 if(!f){toast('Su questo account Google non c\'è nessuna copia');return}
 let j;try{j=JSON.parse(await (await gdApi('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{},tok)).text())}catch(e){toast(e.message||'Copia non leggibile');return}
 const fin=async(jj,pw)=>{try{if(applyBackup(jj)){await licInit();await gdAcct(tok);gdSet({on:true,freq:GD_DAYS[jj.gdf]?jj.gdf:'d',pw:pw||'',last:Date.now(),err:''});LS.set('ac_bk',Date.now());document.getElementById('sov')?.remove();draw();toast('Dati ripristinati da Google Drive');if(after)after()}}catch(e){toast('La copia non è valida')}};
 if(j.enc)askPw('Copia protetta','Scrivi la password scelta quando hai attivato la copia su Drive.',async pw=>{try{await fin(await decObj(j,pw),pw);return''}catch(e){return'Password sbagliata'}});else fin(j,'')}
function gdOff(){if(!confirm('Smetto di salvare su Google Drive? La copia già salvata resta sul tuo Drive.'))return;gdSet({on:false,pw:'',err:'',acct:''});gdTok=null;gdRefresh()}
function gdFreq(v){gdSet({freq:v});toast('Salverò '+GD_NOME[v]);gdRefresh()}
function gdBox(){const c=gdCfg();
 if(!c.on)return `<div id="gdBox"><h2 style="font-size:15px;margin:18px 0 4px">☁️ Copia automatica su Google Drive</h2><div class="sub">Come WhatsApp: scegli ogni quanto salvare e l'app lo fa da sola. Se cambi telefono ripristini tutto.</div><button class="btn w" style="margin-top:10px" onclick="gdAsk()">Collega Google Drive</button><button class="btn o w" style="margin-top:8px" onclick="gdRestore()">Ripristina da Google Drive</button></div>`;
 const ult=c.last?fmtD(isoOf(new Date(c.last)))+' alle '+new Date(c.last).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'ancora nessuna';
 return `<div id="gdBox"><h2 style="font-size:15px;margin:18px 0 4px">☁️ Copia automatica su Google Drive</h2><div class="sub" style="color:var(--t)">✅ Collegato come <b>${c.acct?esc(c.acct):'account non ancora letto (premi «Salva adesso»)'}</b><br>Ultima copia: <b>${ult}</b>${c.pw?' · protetta da password':' · senza password'}</div>${c.err?`<div class="err" style="margin-top:6px">${c.err==='reconnect'?'Non sono riuscito a salvare da solo: premi «Salva adesso» per ricollegare Google.':esc(c.err)}</div>`:''}<div class="sub fl">Salva</div><select onchange="gdFreq(this.value)"><option value="d"${c.freq==='d'?' selected':''}>Ogni giorno</option><option value="w"${c.freq==='w'?' selected':''}>Ogni settimana</option><option value="m"${c.freq==='m'?' selected':''}>Ogni mese</option></select><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1" onclick="gdBackup(true)">Salva adesso</button><button class="btn o" style="flex:1" onclick="gdRestore()">Ripristina</button></div><button class="btn o w" style="margin-top:8px" onclick="gdOff()">Scollega / cambia account</button></div>`}
{const f=settings;settings=function(){const r=f.apply(this,arguments);try{const x=document.getElementById('gdSlot')||document.getElementById('sX');if(x&&!document.getElementById('gdBox'))x.insertAdjacentHTML(x.id==='gdSlot'?'beforeend':'beforebegin',gdBox())}catch(e){console.error(e)}return r}}
{const f=welcome;welcome=function(){const r=f.apply(this,arguments);try{const g=document.getElementById('wGo');if(g&&!document.getElementById('gdW'))g.insertAdjacentHTML('afterend','<button class="btn o w" id="gdW" style="margin-top:10px" onclick="gdRestore(()=>{try{pinSetup()}catch(e){}})">☁️ Ho già una copia su Google Drive</button>')}catch(e){}return r}}
{const f=licBanner;licBanner=function(){let h=f.apply(this,arguments);try{const c=gdCfg();if(c.on&&(c.err==='reconnect'||(c.last&&Date.now()-c.last>3*GD_DAYS[c.freq]*864e5)))h+=`<div class="card" style="border:1px solid #e0a090"><div class="sub" style="color:var(--r)"><b>☁️ La copia su Google Drive non è aggiornata</b> (ultima: ${c.last?fmtD(isoOf(new Date(c.last))):'mai'}).</div><button class="btn s w" style="margin-top:8px" onclick="gdBackup(true)">Salva adesso</button></div>`}catch(e){}return h}}
setTimeout(gdAuto,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(gdAuto,1500)});
setInterval(gdAuto,30*60*1000);

if(!S.tipi.length&&!S.clienti.length)setTimeout(welcome,200);else setTimeout(pinSetup,200);

</script>
